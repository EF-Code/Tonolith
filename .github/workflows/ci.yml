name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ACTON_VERSION: "1.0.0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Acton
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/ton-blockchain/acton/releases/download/v${ACTON_VERSION}/acton-installer.sh" \
            | sh
          acton --version

      - name: Install TypeScript tooling
        run: npm ci

      - name: Check Tolk sources
        run: acton fmt --check

      - name: Check Tolk sources
        run: acton check

      - name: Build Tolk contracts
        run: acton build

      - name: Run Acton contract tests and coverage gate
        run: |
          acton test --fuzz-seed 42
          acton test --coverage --coverage-format text --coverage-minimum-percent 89 --fuzz-seed 42

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build TypeScript tooling
        run: npm run build
