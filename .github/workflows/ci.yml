name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ACTON_VERSION: "1.0.0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Acton
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/ton-blockchain/acton/releases/download/v${ACTON_VERSION}/acton-installer.sh" \
            | sh
          echo "$HOME/.acton/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.acton/bin:$PATH"
          acton --version
          acton init --stdlib-only

      - name: Install TypeScript tooling
        run: npm ci

      - name: Check Tolk sources
        run: acton fmt --check

      - name: Check Tolk sources
        run: acton check

      - name: Build Tolk contracts
        run: acton build

      - name: Run Acton contract tests and coverage gate
        run: |
          acton test --fuzz-seed 42
          npm run test:contract:coverage

      - name: Run Acton mutation gate
        run: npm run test:contract:mutation

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run TypeScript coverage gate
        run: npm run test:coverage

      - name: Build TypeScript tooling
        run: npm run build
